name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: distributed-telemetry-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: distributed-telemetry-platform/services/worker/go.mod
          cache-dependency-path: distributed-telemetry-platform/services/worker/go.sum
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - run: pip install -r services/producer/requirements-dev.txt
      - run: make test-producer test-worker
      - run: test -z "$(gofmt -l services/worker)"
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false -input=false
      - run: terraform -chdir=terraform validate
      - run: docker compose config --quiet
      - run: docker compose build
  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: distributed-telemetry-platform
    steps:
      - uses: actions/checkout@v4
      - run: make setup
      - run: make smoke
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
